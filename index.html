<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>格蘭英語 B 級全方位學習測驗 App</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
    body {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 680px;
      padding: 24px;
      text-align: center;
    }
    h1 { color: #2c3e50; font-size: 22px; margin-bottom: 8px; }
    
    .main-tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .main-tab-btn {
      padding: 8px 12px;
      border: none;
      background: #f1f5f9;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s;
    }
    .main-tab-btn.active {
      background: #2563eb;
      color: white;
    }

    .sub-nav {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .sub-btn {
      padding: 5px 12px;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .sub-btn.active {
      background: #0284c7;
      border-color: #0284c7;
      color: white;
    }

    .score-board { font-size: 15px; font-weight: 600; color: #475569; margin-bottom: 14px; }

    .start-screen, .result-screen, .analysis-screen {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .result-screen, .analysis-screen {
      display: none;
    }
    .start-title { font-size: 20px; font-weight: bold; color: #1e293b; }
    .start-desc { font-size: 14px; color: #64748b; line-height: 1.6; max-width: 480px; }
    .start-run-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 32px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .start-run-btn:active { transform: scale(0.98); }

    .action-btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-secondary {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .quiz-active-area {
      display: none;
    }

    .question-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .prompt-text { font-size: 18px; font-weight: bold; color: #1e293b; line-height: 1.5; }
    .listen-hint { font-size: 13px; color: #475569; }

    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e2e8f0;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: #334155;
      font-weight: bold;
    }
    .ctrl-badge select {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
      color: #1e293b;
      background: white;
    }
    .volume-slider {
      width: 70px;
      cursor: pointer;
    }
    .sound-btn {
      background: #ff9f43;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sound-btn:active { background: #ee5253; }

    .top-feedback-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    #feedback { font-size: 16px; font-weight: bold; min-height: 24px; line-height: 1.5; }
    .tip-box {
      background: #fefce8;
      border-left: 4px solid #facc15;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      color: #713f12;
      border-radius: 4px;
      width: 100%;
      display: none;
    }
    .next-btn {
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 15px;
      cursor: pointer;
      display: none;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    button.opt-btn {
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
    }
    button.opt-btn:disabled { opacity: 0.95; }
    button.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
    button.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
    
    .kk-badge {
      color: #6366f1;
      font-weight: 600;
      font-size: 13px;
      margin-left: 6px;
      font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif;
    }
    .meaning-badge {
      color: #0369a1;
      font-weight: 600;
      font-size: 13px;
      margin-left: 6px;
      background: #e0f2fe;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      width: 100%;
      margin: 10px 0;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .stat-number { font-size: 24px; font-weight: bold; color: #ef4444; }
    .stat-label { font-size: 13px; color: #64748b; margin-top: 4px; }
    
    .mistake-list {
      width: 100%;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      padding-right: 4px;
    }
    .mistake-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }
    .mistake-q { font-weight: bold; color: #1e293b; margin-bottom: 6px; }
    .mistake-ans { color: #15803d; font-weight: 600; }
    .mistake-wrong-tag { color: #dc2626; font-size: 13px; }
    .mistake-tip { background: #fefce8; padding: 6px 8px; border-radius: 4px; color: #713f12; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>格蘭英語 B 級全方位學習測驗</h1>
    
    <div class="main-tabs">
      <button class="main-tab-btn active" onclick="selectMainModule('vocab')">📝 核心單字測驗</button>
      <button class="main-tab-btn" onclick="selectMainModule('grammar')">📖 重點文法測驗</button>
      <button class="main-tab-btn" onclick="selectMainModule('listening')">🎧 官方聽力練習</button>
      <button class="main-tab-btn" onclick="selectMainModule('analysis')">📊 錯題弱點分析</button>
    </div>

    <div class="sub-nav" id="vocab-subnav">
      <button class="sub-btn active" onclick="switchVocabStage('b_level')">⭐ B級綜合測驗 (25題)</button>
    </div>

    <div class="sub-nav" id="listening-subnav" style="display: none;">
      <button class="sub-btn active" onclick="switchListeningStage('review')">考點觀念精選複習</button>
      <button class="sub-btn" onclick="switchListeningStage('p1')">Practice 1 模擬測驗</button>
      <button class="sub-btn" onclick="switchListeningStage('p2')">Practice 2 模擬測驗</button>
    </div>

    <div class="start-screen" id="start-screen">
      <div class="start-title" id="start-title">準備測驗</div>
      <div class="start-desc" id="start-desc">說明內容載入中...</div>
      <button class="start-run-btn" onclick="unlockAudioAndStart()">🚀 開始測驗</button>
    </div>

    <div class="result-screen" id="result-screen">
      <div class="start-title">🎉 本單元測驗完成！</div>
      <p style="font-size: 22px; color: #1e293b; margin: 10px 0;">最終成績：<b id="final-score">0</b> / 100</p>
      <div class="action-btn-group">
        <button class="start-run-btn" onclick="unlockAudioAndStart()">🔄 重新隨機測驗</button>
        <button class="btn-secondary" onclick="selectMainModule('analysis')">📊 查看本次錯題分析</button>
      </div>
    </div>

    <div class="analysis-screen" id="analysis-screen">
      <div class="start-title">📊 個人錯題弱點分析庫</div>
      <div class="start-desc">系統會自動保存作答錯誤的題型，並即時同步至 Google 試算表。</div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">累積錯題總數</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-vocab">0</div>
          <div class="stat-label">單字弱點</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-grammar">0</div>
          <div class="stat-label">文法弱點</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-listening">0</div>
          <div class="stat-label">聽力弱點</div>
        </div>
      </div>

      <div class="action-btn-group">
        <button class="btn-secondary" onclick="startMistakeReviewQuiz()">🎯 錯題專項重測 (最多20題)</button>
        <button class="btn-danger" onclick="clearMistakeHistory()">🗑️ 清空所有錯題</button>
      </div>

      <div class="mistake-list" id="mistake-list-container"></div>
    </div>

    <div class="quiz-active-area" id="quiz-active-area">
      <div class="score-board">
        進度: <span id="q-index">1</span> / <span id="total-q">0</span> | 目前得分: <span id="score">0</span>
      </div>

      <div class="question-box">
        <span class="listen-hint" id="listen-hint">🎧 聽力播放中，請注意聆聽：</span>
        <div class="prompt-text" id="display-prompt">載入中...</div>
        
        <div class="audio-controls" id="audio-ctrl-group">
          <button class="sound-btn" onclick="playCurrentAudioUser()">
            🔊 播放音訊
          </button>

          <div class="ctrl-badge">
            <label for="speed-select">⚡ 語速：</label>
            <select id="speed-select" onchange="changeSpeechRate()">
              <option value="0.6">稍慢（0.6x）</option>
              <option value="0.7">慢（0.7x）</option>
              <option value="0.85" selected>正常（0.85x）</option>
            </select>
          </div>

          <div class="ctrl-badge">
            <label for="volume-range">📢 音量：</label>
            <input type="range" id="volume-range" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
            <span id="volume-val" style="min-width: 28px; text-align: right;">100%</span>
          </div>
        </div>
      </div>

      <div class="top-feedback-area">
        <div id="feedback"></div>
        <div class="tip-box" id="tip-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
      </div>

      <div class="options-container" id="options-container"></div>
    </div>
  </div>

  <script src="questions.js"></script>

  <script>
    // ==========================================
    // Google 表單雲端同步設定 (已優化：公開發布路徑 + 原生表單背景傳送)
    // ==========================================
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScPPuAAn9a-WxVNiYT2AvZIr2nNXgLKc7lQQJH8d582Bnsmww/formResponse";

    const ENTRY_NAME      = "entry.1497266437"; // 學生姓名/裝置
    const ENTRY_MODULE    = "entry.1362970063"; // 單元分類
    const ENTRY_PROMPT    = "entry.762033637";  // 題目內容
    const ENTRY_WRONG     = "entry.588673430";  // 學生選錯選項
    const ENTRY_CORRECT   = "entry.1140385408"; // 正確答案
    const STUDENT_NAME    = "林小朋友";         // 裝置或學生辨識名稱

    // 優化 2：單輪測驗防重複發送快取集合
    let sessionSentMistakes = new Set();

    function submitToGoogleForm(payload) {
      let hiddenIframe = document.getElementById("hidden_iframe");
      if (!hiddenIframe) {
        hiddenIframe = document.createElement("iframe");
        hiddenIframe.id = "hidden_iframe";
        hiddenIframe.name = "hidden_iframe";
        hiddenIframe.style.display = "none";
        document.body.appendChild(hiddenIframe);
      }

      const form = document.createElement("form");
      form.method = "POST";
      form.action = GOOGLE_FORM_URL;
      form.target = "hidden_iframe";
      form.style.display = "none";

      const fields = {
        [ENTRY_NAME]: payload.name || STUDENT_NAME,
        [ENTRY_MODULE]: payload.module,
        [ENTRY_PROMPT]: payload.prompt,
        [ENTRY_WRONG]: payload.wrong,
        [ENTRY_CORRECT]: payload.correct
      };

      for (const [key, value] of Object.entries(fields)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = value;
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
      setTimeout(() => {
        form.remove();
      }, 1000);
    }

    function sendMistakeToGoogleForm(data) {
      // 防重複送出校驗
      const mistakeKey = `${data.promptText}_${data.selectedWord}`;
      if (sessionSentMistakes.has(mistakeKey)) return;
      sessionSentMistakes.add(mistakeKey);

      submitToGoogleForm({
        module: data.moduleName,
        prompt: data.promptText,
        wrong: data.selectedWord,
        correct: `${data.correctWord} ${data.correctMeaning ? '(' + data.correctMeaning + ')' : ''}`
      });
    }

    // 優化 3：自動同步測驗結算與總分摘要
    function sendSessionSummaryToGoogleForm(moduleName, score, totalCount, correctCount) {
      const wrongCount = totalCount - correctCount;
      submitToGoogleForm({
        module: "🏁 測驗結算摘要",
        prompt: `【${moduleName}】測驗共 ${totalCount} 題`,
        wrong: `答錯 ${wrongCount} 題 / 答對 ${correctCount} 題`,
        correct: `最終得分: ${score} 分`
      });
    }

    let speechRate = 0.85;
    let speechVolume = 1.0;
    let currentModule = "vocab";
    let currentVocabStage = "b_level";
    let currentListeningStage = "review";
    let audioTimer = null;

    let currentQuestions = [];
    let currentIdx = 0;
    let correctCount = 0;
    let cachedVoices = [];
    let isMistakeMode = false;

    const STORAGE_KEY = "gram_b_quiz_mistakes";
    function getMistakes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }
    function saveMistake(item) {
      const list = getMistakes();
      const existsIndex = list.findIndex(m => m.promptText === item.promptText && m.correctWord === item.correctWord);
      if (existsIndex >= 0) {
        list[existsIndex] = item;
      } else {
        list.unshift(item);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));

      sendMistakeToGoogleForm(item);
    }
    function removeMistake(promptText, correctWord) {
      const list = getMistakes().filter(m => !(m.promptText === promptText && m.correctWord === correctWord));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }
    function clearMistakeHistory() {
      if (confirm("確定要清空所有累積的錯題記錄嗎？")) {
        localStorage.removeItem(STORAGE_KEY);
        renderAnalysisScreen();
      }
    }

    function initVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          cachedVoices = window.speechSynthesis.getVoices();
        };
      }
    }
    initVoices();

    function stopAllAudio() {
      if (audioTimer) {
        clearTimeout(audioTimer);
        audioTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function changeSpeechRate() {
      speechRate = parseFloat(document.getElementById("speed-select").value);
    }

    function changeVolume() {
      speechVolume = parseFloat(document.getElementById("volume-range").value);
      document.getElementById("volume-val").textContent = Math.round(speechVolume * 100) + "%";
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function unlockAudioAndStart() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const silentUtter = new SpeechSynthesisUtterance(" ");
        silentUtter.volume = 0.01;
        window.speechSynthesis.speak(silentUtter);
      }
      startCurrentQuiz();
    }

    function setupStartScreen() {
      stopAllAudio();
      document.getElementById("start-screen").style.display = "flex";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("analysis-screen").style.display = "none";
      document.getElementById("quiz-active-area").style.display = "none";

      const titleElem = document.getElementById("start-title");
      const descElem = document.getElementById("start-desc");

      if (currentModule === "vocab") {
        titleElem.textContent = "⭐ 核心單字：B 級綜合測驗 (25題)";
        descElem.textContent = "從 450+ 官方大綱字彙庫隨機出題 25 題，進入題目後會自動朗讀英語發音，作答後揭曉中文！每題 4 分，滿分 100 分。";
      } else if (currentModule === "grammar") {
        titleElem.textContent = "📖 重點文法測驗 (500題隨機題庫)";
        descElem.textContent = "涵蓋時間介系詞、進行式、存在句與助動詞，隨機抽樣 25 題練習！";
      } else if (currentModule === "listening") {
        if (currentListeningStage === "review") {
          titleElem.textContent = "🎧 官方聽力：考點觀念精選複習";
          descElem.textContent = "共 8 題，重點提煉八大聽力陷阱。";
        } else if (currentListeningStage === "p1") {
          titleElem.textContent = "🎯 Practice 1 全真模擬測驗";
          descElem.textContent = "共 40 題，包含 Part 1-4 完整檢定結構。";
        } else if (currentListeningStage === "p2") {
          titleElem.textContent = "🎯 Practice 2 全真模擬測驗";
          descElem.textContent = "共 50 題，包含長篇短文與對話。";
        }
      }
    }

    function renderAnalysisScreen() {
      stopAllAudio();
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("quiz-active-area").style.display = "none";
      document.getElementById("analysis-screen").style.display = "flex";

      const list = getMistakes();
      document.getElementById("stat-total").textContent = list.length;
      document.getElementById("stat-vocab").textContent = list.filter(m => m.module === "vocab").length;
      document.getElementById("stat-grammar").textContent = list.filter(m => m.module === "grammar").length;
      document.getElementById("stat-listening").textContent = list.filter(m => m.module === "listening").length;

      const container = document.getElementById("mistake-list-container");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<div style="color: #64748b; padding: 20px;">太棒了！目前沒有任何錯題紀錄 🎉</div>`;
        return;
      }

      list.forEach((m, idx) => {
        const item = document.createElement("div");
        item.className = "mistake-item";
        item.innerHTML = `
          <div class="mistake-q">#${idx + 1} [${m.moduleName}] ${m.promptText}</div>
          <div class="mistake-wrong-tag">❌ 曾選錯誤：${m.selectedWord}</div>
          <div class="mistake-ans">✅ 正確答案：${m.correctWord} ${m.correctMeaning ? `(${m.correctMeaning})` : ''}</div>
          ${m.tip ? `<div class="mistake-tip">${m.tip}</div>` : ''}
        `;
        container.appendChild(item);
      });
    }

    function startMistakeReviewQuiz() {
      const list = getMistakes();
      if (list.length === 0) {
        alert("目前沒有任何錯題可進行重測！");
        return;
      }

      isMistakeMode = true;
      sessionSentMistakes.clear(); // 重置單輪送出快取
      document.getElementById("analysis-screen").style.display = "none";
      document.getElementById("quiz-active-area").style.display = "block";

      const reviewTargets = shuffleArray(list).slice(0, 20);
      currentQuestions = reviewTargets.map(m => m.rawQuestion);

      currentIdx = 0;
      correctCount = 0;
      document.getElementById("score").textContent = "0";
      loadQuestion();
    }

    function startCurrentQuiz() {
      isMistakeMode = false;
      sessionSentMistakes.clear(); // 重置單輪送出快取
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("analysis-screen").style.display = "none";
      document.getElementById("quiz-active-area").style.display = "block";

      let source = [];
      if (currentModule === "vocab") {
        if (typeof buildDynamicVocabQuiz === 'function') {
          source = buildDynamicVocabQuiz(25, "⭐ B級綜合測驗 (25題)");
        } else {
          source = rawVocabBLevel.slice(0, 25);
        }
      } else if (currentModule === "grammar") {
        source = rawGrammarQuestions.slice(0, 25);
      } else {
        if (currentListeningStage === "review") source = rawReviewQuestions;
        else if (currentListeningStage === "p1") source = rawMockP1;
        else if (currentListeningStage === "p2") source = rawMockP2;
      }

      currentQuestions = shuffleArray(source).map(q => {
        if (q.options && q.options.length > 0) {
          const combined = q.options.map((opt, idx) => ({
            opt: opt,
            meaning: q.meanings ? q.meanings[idx] : null,
            kk: q.kkList ? q.kkList[idx] : null,
            isCorrect: idx === q.ans
          }));
          const shuffledCombined = shuffleArray(combined);
          return {
            ...q,
            options: shuffledCombined.map(c => c.opt),
            meanings: q.meanings ? shuffledCombined.map(c => c.meaning) : null,
            kkList: q.kkList ? shuffledCombined.map(c => c.kk) : null,
            ans: shuffledCombined.findIndex(c => c.isCorrect)
          };
        }
        return { ...q };
      });

      currentIdx = 0;
      correctCount = 0;
      document.getElementById("score").textContent = "0";
      loadQuestion();
    }

    function selectMainModule(mod) {
      stopAllAudio();
      currentModule = mod;

      const tabBtns = document.querySelectorAll(".main-tab-btn");
      tabBtns.forEach(b => b.classList.remove("active"));

      const vocabNav = document.getElementById("vocab-subnav");
      const listenNav = document.getElementById("listening-subnav");
      const audioControls = document.getElementById("audio-ctrl-group");
      const listenHint = document.getElementById("listen-hint");

      if (mod === "vocab") {
        tabBtns[0].classList.add("active");
        vocabNav.style.display = "flex";
        listenNav.style.display = "none";
        audioControls.style.display = "flex";
        listenHint.textContent = "🔊 進入題目自動發音，也可手動點擊：";
        setupStartScreen();
      } else if (mod === "grammar") {
        tabBtns[1].classList.add("active");
        vocabNav.style.display = "none";
        listenNav.style.display = "none";
        audioControls.style.display = "none";
        listenHint.textContent = "✏️ 請閱讀題目，選出最適當的答案：";
        setupStartScreen();
      } else if (mod === "listening") {
        tabBtns[2].classList.add("active");
        vocabNav.style.display = "none";
        listenNav.style.display = "flex";
        audioControls.style.display = "flex";
        listenHint.textContent = "🎧 聽力播放中，請注意聆聽：";
        switchListeningStage('review');
      } else if (mod === "analysis") {
        tabBtns[3].classList.add("active");
        vocabNav.style.display = "none";
        listenNav.style.display = "none";
        renderAnalysisScreen();
      }
    }

    function switchVocabStage(stage) {
      stopAllAudio();
      currentVocabStage = stage;
      setupStartScreen();
    }

    function switchListeningStage(stage) {
      stopAllAudio();
      currentListeningStage = stage;
      const subBtns = document.querySelectorAll("#listening-subnav .sub-btn");
      subBtns.forEach(b => b.classList.remove("active"));

      if (stage === 'review') subBtns[0].classList.add("active");
      else if (stage === 'p1') subBtns[1].classList.add("active");
      else if (stage === 'p2') subBtns[2].classList.add("active");

      setupStartScreen();
    }

    function playSpeech(text, callback) {
      if (!('speechSynthesis' in window)) return;

      stopAllAudio();
      window.speechSynthesis.resume();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = speechRate;
      utter.volume = speechVolume;
      utter.pitch = 1.0;

      if (cachedVoices.length === 0) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
      const englishVoice = cachedVoices.find(v => v.lang && (v.lang.startsWith('en-US') || v.lang.startsWith('en')));
      if (englishVoice) {
        utter.voice = englishVoice;
      }

      if (callback) {
        utter.onend = callback;
        utter.onerror = callback;
      }

      window.speechSynthesis.speak(utter);
    }

    function playCurrentAudioUser() {
      playCurrentAudio();
    }

    function playCurrentAudio() {
      const q = currentQuestions[currentIdx];
      if (!q || !q.audioText) return;

      if (q.repeat) {
        playSpeech(q.audioText, () => {
          audioTimer = setTimeout(() => {
            playSpeech(q.audioText);
          }, 1000);
        });
      } else {
        playSpeech(q.audioText);
      }
    }

    function loadQuestion() {
      stopAllAudio();

      const q = currentQuestions[currentIdx];
      document.getElementById("q-index").textContent = currentIdx + 1;
      document.getElementById("total-q").textContent = currentQuestions.length;
      document.getElementById("display-prompt").textContent = q.prompt;
      document.getElementById("feedback").textContent = "";
      document.getElementById("tip-box").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      const letters = ["A", "B", "C", "D"];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.id = `opt-btn-${idx}`;
        
        let kkHtml = "";
        if (currentModule === "vocab" && q.kkList && q.kkList[idx]) {
          kkHtml = `<span class="kk-badge">${q.kkList[idx]}</span>`;
        }

        btn.innerHTML = `<b>(${letters[idx]})</b> ${opt} ${kkHtml}`;
        btn.onclick = () => checkAnswer(idx, btn, q.ans);
        container.appendChild(btn);
      });

      if (currentModule === "listening" || currentModule === "vocab" || (isMistakeMode && q.audioText)) {
        audioTimer = setTimeout(() => {
          playCurrentAudio();
        }, 300);
      }
    }

    function checkAnswer(selectedIdx, targetBtn, correctIdx) {
      stopAllAudio();

      const buttons = document.querySelectorAll(".opt-btn");
      buttons.forEach(b => b.disabled = true);

      const letters = ["A", "B", "C", "D"];
      const feedback = document.getElementById("feedback");
      const q = currentQuestions[currentIdx];

      if (currentModule === "vocab" && q.meanings) {
        q.options.forEach((opt, idx) => {
          const btn = document.getElementById(`opt-btn-${idx}`);
          if (btn) {
            const kkHtml = q.kkList && q.kkList[idx] ? `<span class="kk-badge">${q.kkList[idx]}</span>` : "";
            const meanHtml = `<span class="meaning-badge">中文：${q.meanings[idx]}</span>`;
            btn.innerHTML = `<b>(${letters[idx]})</b> ${opt} ${kkHtml} ${meanHtml}`;
          }
        });
      }

      const correctWord = q.options[correctIdx];
      const correctMeaning = (currentModule === "vocab" && q.meaning) ? q.meaning : "";

      if (selectedIdx === correctIdx) {
        correctCount++;
        targetBtn.classList.add("correct");
        if (currentModule === "vocab") {
          feedback.textContent = `答對了！Very Good! 🎉英文: ${correctWord} ，中文: ${correctMeaning}`;
        } else {
          feedback.textContent = "答對了！Very Good! 🎉";
        }
        feedback.style.color = "#15803d";

        if (isMistakeMode) {
          removeMistake(q.prompt, correctWord);
        }
      } else {
        targetBtn.classList.add("wrong");
        if (currentModule === "vocab") {
          feedback.textContent = `答錯囉！正確答案是 (${letters[correctIdx]}) 英文: ${correctWord} ，中文: ${correctMeaning}`;
        } else {
          feedback.textContent = `答錯囉！正確答案是 (${letters[correctIdx]})`;
        }
        feedback.style.color = "#b91c1c";
        if (buttons[correctIdx]) buttons[correctIdx].classList.add("correct");

        let moduleCategory = currentModule;
        let moduleTitle = "核心單字";
        if (currentModule === "grammar") moduleTitle = "重點文法";
        if (currentModule === "listening") moduleTitle = "官方聽力";

        saveMistake({
          module: moduleCategory,
          moduleName: moduleTitle,
          promptText: q.prompt,
          selectedWord: q.options[selectedIdx],
          correctWord: correctWord,
          correctMeaning: correctMeaning,
          tip: q.tip || "",
          rawQuestion: q
        });
      }

      const currentScore = Math.round((correctCount / currentQuestions.length) * 100);
      document.getElementById("score").textContent = currentScore;

      if (q.tip) {
        const tipBox = document.getElementById("tip-box");
        tipBox.textContent = q.tip;
        tipBox.style.display = "block";
      }

      if ((currentModule === "vocab" || isMistakeMode) && q.audioText) {
        playSpeech(q.audioText);
      }

      document.getElementById("next-btn").style.display = "inline-block";
    }

    function nextQuestion() {
      stopAllAudio();
      currentIdx++;
      if (currentIdx < currentQuestions.length) {
        loadQuestion();
      } else {
        document.getElementById("quiz-active-area").style.display = "none";
        const finalScore = Math.round((correctCount / currentQuestions.length) * 100);
        document.getElementById("final-score").textContent = finalScore;
        document.getElementById("result-screen").style.display = "flex";

        // 優化 3：測驗完成自動送出整輪摘要成績
        let moduleName = "核心單字 (B級綜合測驗)";
        if (currentModule === "grammar") moduleName = "重點文法測驗";
        if (currentModule === "listening") moduleName = `官方聽力 (${currentListeningStage})`;
        if (isMistakeMode) moduleName = "錯題專項重測";

        sendSessionSummaryToGoogleForm(moduleName, finalScore, currentQuestions.length, correctCount);
      }
    }

    setupStartScreen();
  </script>
